<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" stroke-width="1.3" stroke-linecap="round">
  <!-- The particle halo behind the popup's action stack, after the arcs on
       antigravity.google. Every particle sits at the top of a ring centred at
       (200, 450) and is swung into place with rotate(), so a dash is always
       tangent to its ring and the arcs stay true without a single computed
       coordinate. Brighter in the middle, thinning out towards the ends. -->

  <!-- Ring A: r = 300, the top of the ring at y = 150 -->
  <g>
    <circle cx="200" cy="150" r="1.1" fill="#9AA0A6" fill-opacity="0.30" transform="rotate(-31 200 450)"/>
    <line x1="198" y1="150" x2="202" y2="150" stroke="#4285F4" stroke-opacity="0.35" transform="rotate(-27.5 200 450)"/>
    <circle cx="200" cy="148" r="1.2" fill="#FBBC04" fill-opacity="0.45" transform="rotate(-24 200 450)"/>
    <circle cx="200" cy="152" r="0.9" fill="#4285F4" fill-opacity="0.50" transform="rotate(-21 200 450)"/>
    <line x1="197.5" y1="150" x2="202.5" y2="150" stroke="#EA4335" stroke-opacity="0.55" transform="rotate(-17.5 200 450)"/>
    <circle cx="200" cy="149" r="1.4" fill="#7B61FF" fill-opacity="0.60" transform="rotate(-14 200 450)"/>
    <circle cx="200" cy="153" r="1" fill="#34A853" fill-opacity="0.55" transform="rotate(-10.5 200 450)"/>
    <line x1="198" y1="150" x2="202" y2="150" stroke="#4285F4" stroke-opacity="0.70" transform="rotate(-7 200 450)"/>
    <circle cx="200" cy="147" r="1.3" fill="#EA4335" fill-opacity="0.65" transform="rotate(-3.5 200 450)"/>
    <circle cx="200" cy="151" r="1.1" fill="#FBBC04" fill-opacity="0.70" transform="rotate(0.5 200 450)"/>
    <line x1="197" y1="150" x2="203" y2="150" stroke="#7B61FF" stroke-opacity="0.65" transform="rotate(4 200 450)"/>
    <circle cx="200" cy="149" r="1.5" fill="#4285F4" fill-opacity="0.70" transform="rotate(7.5 200 450)"/>
    <circle cx="200" cy="152" r="0.9" fill="#9AA0A6" fill-opacity="0.60" transform="rotate(11 200 450)"/>
    <line x1="198" y1="150" x2="202" y2="150" stroke="#34A853" stroke-opacity="0.55" transform="rotate(14.5 200 450)"/>
    <circle cx="200" cy="148" r="1.2" fill="#EA4335" fill-opacity="0.55" transform="rotate(18 200 450)"/>
    <circle cx="200" cy="151" r="1.3" fill="#4285F4" fill-opacity="0.50" transform="rotate(21.5 200 450)"/>
    <line x1="198" y1="150" x2="202" y2="150" stroke="#FBBC04" stroke-opacity="0.40" transform="rotate(25 200 450)"/>
    <circle cx="200" cy="149" r="1" fill="#7B61FF" fill-opacity="0.35" transform="rotate(28.5 200 450)"/>
    <circle cx="200" cy="152" r="1.1" fill="#9AA0A6" fill-opacity="0.28" transform="rotate(32 200 450)"/>
  </g>

  <!-- Ring B: r = 340, the top of the ring at y = 110 -->
  <g>
    <line x1="198" y1="110" x2="202" y2="110" stroke="#9AA0A6" stroke-opacity="0.28" transform="rotate(-34 200 450)"/>
    <circle cx="200" cy="112" r="1" fill="#4285F4" fill-opacity="0.32" transform="rotate(-31 200 450)"/>
    <circle cx="200" cy="107" r="1.3" fill="#EA4335" fill-opacity="0.40" transform="rotate(-28 200 450)"/>
    <line x1="197.5" y1="110" x2="202.5" y2="110" stroke="#7B61FF" stroke-opacity="0.45" transform="rotate(-25 200 450)"/>
    <circle cx="200" cy="111" r="0.9" fill="#FBBC04" fill-opacity="0.50" transform="rotate(-22.5 200 450)"/>
    <circle cx="200" cy="108" r="1.4" fill="#4285F4" fill-opacity="0.55" transform="rotate(-19.5 200 450)"/>
    <line x1="198" y1="110" x2="202" y2="110" stroke="#34A853" stroke-opacity="0.55" transform="rotate(-16.5 200 450)"/>
    <circle cx="200" cy="113" r="1.1" fill="#9AA0A6" fill-opacity="0.50" transform="rotate(-13.5 200 450)"/>
    <circle cx="200" cy="109" r="1.2" fill="#7B61FF" fill-opacity="0.65" transform="rotate(-10.5 200 450)"/>
    <line x1="197" y1="110" x2="203" y2="110" stroke="#4285F4" stroke-opacity="0.70" transform="rotate(-7.5 200 450)"/>
    <circle cx="200" cy="112" r="1" fill="#EA4335" fill-opacity="0.60" transform="rotate(-4.5 200 450)"/>
    <circle cx="200" cy="107" r="1.5" fill="#FBBC04" fill-opacity="0.70" transform="rotate(-1.5 200 450)"/>
    <line x1="198" y1="110" x2="202" y2="110" stroke="#9AA0A6" stroke-opacity="0.55" transform="rotate(1.5 200 450)"/>
    <circle cx="200" cy="111" r="1.2" fill="#4285F4" fill-opacity="0.70" transform="rotate(4.5 200 450)"/>
    <circle cx="200" cy="108" r="0.9" fill="#34A853" fill-opacity="0.60" transform="rotate(7.5 200 450)"/>
    <line x1="197.5" y1="110" x2="202.5" y2="110" stroke="#EA4335" stroke-opacity="0.60" transform="rotate(10.5 200 450)"/>
    <circle cx="200" cy="112" r="1.3" fill="#7B61FF" fill-opacity="0.55" transform="rotate(13.5 200 450)"/>
    <circle cx="200" cy="109" r="1" fill="#4285F4" fill-opacity="0.55" transform="rotate(16.5 200 450)"/>
    <line x1="198" y1="110" x2="202" y2="110" stroke="#FBBC04" stroke-opacity="0.50" transform="rotate(19.5 200 450)"/>
    <circle cx="200" cy="113" r="1.2" fill="#9AA0A6" fill-opacity="0.45" transform="rotate(22.5 200 450)"/>
    <circle cx="200" cy="108" r="1.1" fill="#EA4335" fill-opacity="0.40" transform="rotate(25.5 200 450)"/>
    <line x1="198" y1="110" x2="202" y2="110" stroke="#4285F4" stroke-opacity="0.35" transform="rotate(28.5 200 450)"/>
    <circle cx="200" cy="111" r="1" fill="#34A853" fill-opacity="0.30" transform="rotate(31.5 200 450)"/>
    <circle cx="200" cy="109" r="0.9" fill="#7B61FF" fill-opacity="0.25" transform="rotate(34.5 200 450)"/>
  </g>

  <!-- Ring C: r = 385, the top of the ring at y = 65 -->
  <g>
    <circle cx="200" cy="66" r="1" fill="#9AA0A6" fill-opacity="0.22" transform="rotate(-29.5 200 450)"/>
    <line x1="198" y1="65" x2="202" y2="65" stroke="#FBBC04" stroke-opacity="0.28" transform="rotate(-27 200 450)"/>
    <circle cx="200" cy="62" r="1.2" fill="#4285F4" fill-opacity="0.32" transform="rotate(-24.5 200 450)"/>
    <circle cx="200" cy="68" r="0.9" fill="#7B61FF" fill-opacity="0.36" transform="rotate(-22 200 450)"/>
    <line x1="198" y1="65" x2="202" y2="65" stroke="#EA4335" stroke-opacity="0.40" transform="rotate(-19 200 450)"/>
    <circle cx="200" cy="64" r="1.3" fill="#34A853" fill-opacity="0.42" transform="rotate(-16.5 200 450)"/>
    <circle cx="200" cy="67" r="1" fill="#4285F4" fill-opacity="0.48" transform="rotate(-14 200 450)"/>
    <line x1="197.5" y1="65" x2="202.5" y2="65" stroke="#9AA0A6" stroke-opacity="0.45" transform="rotate(-11 200 450)"/>
    <circle cx="200" cy="63" r="1.1" fill="#FBBC04" fill-opacity="0.50" transform="rotate(-8.5 200 450)"/>
    <circle cx="200" cy="66" r="1.4" fill="#7B61FF" fill-opacity="0.52" transform="rotate(-6 200 450)"/>
    <line x1="198" y1="65" x2="202" y2="65" stroke="#4285F4" stroke-opacity="0.55" transform="rotate(-3 200 450)"/>
    <circle cx="200" cy="68" r="0.9" fill="#EA4335" fill-opacity="0.50" transform="rotate(-0.5 200 450)"/>
    <circle cx="200" cy="63" r="1.2" fill="#34A853" fill-opacity="0.52" transform="rotate(2 200 450)"/>
    <line x1="197.5" y1="65" x2="202.5" y2="65" stroke="#7B61FF" stroke-opacity="0.55" transform="rotate(5 200 450)"/>
    <circle cx="200" cy="66" r="1.1" fill="#4285F4" fill-opacity="0.52" transform="rotate(7.5 200 450)"/>
    <circle cx="200" cy="64" r="1.3" fill="#FBBC04" fill-opacity="0.48" transform="rotate(10 200 450)"/>
    <line x1="198" y1="65" x2="202" y2="65" stroke="#EA4335" stroke-opacity="0.45" transform="rotate(13 200 450)"/>
    <circle cx="200" cy="67" r="1" fill="#9AA0A6" fill-opacity="0.42" transform="rotate(15.5 200 450)"/>
    <circle cx="200" cy="62" r="1.2" fill="#4285F4" fill-opacity="0.40" transform="rotate(18 200 450)"/>
    <line x1="198" y1="65" x2="202" y2="65" stroke="#34A853" stroke-opacity="0.36" transform="rotate(21 200 450)"/>
    <circle cx="200" cy="66" r="1.1" fill="#7B61FF" fill-opacity="0.32" transform="rotate(23.5 200 450)"/>
    <circle cx="200" cy="64" r="0.9" fill="#EA4335" fill-opacity="0.28" transform="rotate(26 200 450)"/>
    <line x1="198" y1="65" x2="202" y2="65" stroke="#4285F4" stroke-opacity="0.24" transform="rotate(28.5 200 450)"/>
  </g>

  <!-- Loose specks between the rings, so the field reads as drift rather
       than three tidy circles. -->
  <g>
    <circle cx="200" cy="131" r="0.8" fill="#4285F4" fill-opacity="0.35" transform="rotate(-20 200 450)"/>
    <circle cx="200" cy="128" r="0.8" fill="#EA4335" fill-opacity="0.35" transform="rotate(-6 200 450)"/>
    <circle cx="200" cy="133" r="0.8" fill="#FBBC04" fill-opacity="0.35" transform="rotate(9 200 450)"/>
    <circle cx="200" cy="129" r="0.8" fill="#7B61FF" fill-opacity="0.35" transform="rotate(23 200 450)"/>
    <circle cx="200" cy="88" r="0.8" fill="#34A853" fill-opacity="0.30" transform="rotate(-26 200 450)"/>
    <circle cx="200" cy="90" r="0.8" fill="#4285F4" fill-opacity="0.30" transform="rotate(-12 200 450)"/>
    <circle cx="200" cy="86" r="0.8" fill="#EA4335" fill-opacity="0.30" transform="rotate(3 200 450)"/>
    <circle cx="200" cy="89" r="0.8" fill="#9AA0A6" fill-opacity="0.30" transform="rotate(17 200 450)"/>
    <circle cx="200" cy="87" r="0.8" fill="#7B61FF" fill-opacity="0.30" transform="rotate(29 200 450)"/>
  </g>
</svg>
